name: Deploy gate

# Fires when Vercel (or any integration) reports a deployment through the
# GitHub Deployments API. The gate only runs on success: a failed build has
# nothing to smoke, and its own status is already the signal.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the script only uses the global fetch, so this stays
      # fast enough to run on every deployment.
      # A deployment is reported "success" a moment before every edge serves
      # the new build, so the first probe can still hit the previous one. Three
      # attempts thirty seconds apart separates a real regression from that
      # race: this job failed exactly that way on af154f2 while the same URL was
      # healthy when probed by hand a minute later.
      - name: Smoke the deployed environment
        env:
          TARGET: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if node scripts/check-deploy.mjs "$TARGET"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" != "3" ]; then
              echo "Retrying in 30s…"
              sleep 30
            fi
          done
          echo "::error title=Deploy smoke check failed::$TARGET did not report healthy after 3 attempts."
          exit 1
