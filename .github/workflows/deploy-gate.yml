name: Deploy gate

# Fires when Vercel (or any integration) reports a deployment through the
# GitHub Deployments API. The gate runs on successful *production* deployments
# only: a failed build has nothing to smoke, and a preview is behind Vercel
# authentication, so probing it gets a login page rather than the app.
on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: >
      github.event.deployment_status.state == 'success' &&
      !startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the script only uses the global fetch, so this stays
      # fast enough to run on every deployment.
      # The alias can trail the deployment by a moment, so a single probe may
      # still reach the previous build. Three attempts thirty seconds apart tell
      # that apart from a real regression.
      #
      # `environment_url` is deliberately not used: it is the per-deployment URL
      # (…-<hash>-<team>.vercel.app), which is protected and is not what anyone
      # visits. The stable production alias is.
      - name: Smoke the deployed environment
        env:
          TARGET: ${{ vars.PRODUCTION_URL || 'https://mtl-trader.vercel.app' }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            if node scripts/check-deploy.mjs "$TARGET"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" != "3" ]; then
              echo "Retrying in 30s…"
              sleep 30
            fi
          done
          echo "::error title=Deploy smoke check failed::$TARGET did not report healthy after 3 attempts."
          exit 1
