name: mtl_trader_mobile
description: MTL Trader — a flat, native trading journal for MT5 traders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.0
  fl_chart: ^0.69.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  record: ^7.1.2
  just_audio: ^0.9.42
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
