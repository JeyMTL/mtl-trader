name: mtl_trader_mobile
description: MTL Trader — a flat, native trading journal for MT5 traders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  fl_chart: ^1.3.0
  # Pinned by flutter_localizations; gen-l10n generates against this version.
  intl: ^0.20.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  record: ^7.1.2
  just_audio: ^0.9.42
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Regenerates lib/l10n/gen from the ARB files on every build.
  generate: true
  fonts:
    # Sora for the interface, JetBrains Mono for every number. Both are
    # bundled so the first frame never waits on a font download.
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
